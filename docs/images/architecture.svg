<text x="64" y="878" text-anchor="start" dominant-baseline="auto" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#516172">ADF orchestrates all stages; Azure SQL stores metadata, watermarks and audit rows.</text>
<text x="64" y="911" text-anchor="start" dominant-baseline="auto" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#516172">Key Vault stores secrets; Logic Apps handles the notification request and email.</text>
<text x="64" y="944" text-anchor="start" dominant-baseline="auto" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#516172">GitHub Actions validates the repository and imports Databricks notebooks.</text>
<text x="64" y="977" text-anchor="start" dominant-baseline="auto" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#516172">ADF authoring uses /adf and publishes separately to the live factory.</text>
